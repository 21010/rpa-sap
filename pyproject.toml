[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa-sap"
version = "2.0.3"
description = "A comprehensive Python library for robust SAP GUI automation and RFC integration, designed for RPA workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Grzegorz Zioło" }]
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.2",
    "pywin32>=311",
    "requests>=2.31.0",
    "wmi>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "bandit>=1.7.8",
    "ruff>=0.3.0",
    "pyrefly>=1.0.0",
    "pytest-cov>=4.1.0",
    "requests-mock>=1.12.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring real SAP connection",
]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
