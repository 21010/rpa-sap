name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --dev

      - name: Code formatting & linting (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
        continue-on-error: true

      - name: Type checking (Pyright)
        run: uv run pyright rpa_sap
        continue-on-error: true

      - name: Security scanning (Bandit)
        run: uv run bandit -r rpa_sap
        continue-on-error: true

      - name: Run unit tests (PyTest)
        # Note: Pytest requires an active SAP GUI installation to run properly unless mocked.
        # You may need to mock win32com.client in your tests or handle CI-specific skipping.
        run: uv run pytest
        env:
          CI: "true"
