name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  lint:
    name: Lint & Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.10"
      - run: uv sync --dev
      - run: |
          uv run ruff check .
          uv run ruff format --check .

  type-check:
    name: Type Checking
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.10"
      - run: uv sync --dev
      - run: uv run pyrefly check

  security:
    name: Security Scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.10"
      - run: uv sync --dev
      - name: Bandit Scan
        run: uv run bandit -r rpa_sap
      - name: UV Dependency Audit
        env:
          UV_PREVIEW: 1
        run: uv audit

  test-unit:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.10"
      - run: uv sync --dev
      - run: uv run pytest tests/unit --cov=rpa_sap --cov-report=xml
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
